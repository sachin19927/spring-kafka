version: '3.8'

services:

  kafbat:
    image: kafbat/kafka-ui:latest
    container_name: kafbat
    hostname: kafbat

    ports:
      - "${KAFBAT_PORT}:8080"

    environment:
      DYNAMIC_CONFIG_ENABLED: "true"

      KAFKA_CLUSTERS_0_NAME: Local Kafka

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092

      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

    networks:
      - kafka-network

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    hostname: kafdrop

    ports:
      - "${KAFDROP_PORT}:9000"

    environment:
      KAFKA_BROKERCONNECT: kafka1:29092,kafka2:29092,kafka3:29092
      SERVER_PORT: 9000
      JVM_OPTS: "-Xms64M -Xmx256M"

    networks:
      - kafka-network

  akhq:
    image: tchiotludo/akhq:latest
    container_name: akhq
    hostname: akhq

    ports:
      - "${AKHQ_PORT}:8080"

    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            local:
              properties:
                bootstrap.servers: kafka1:29092,kafka2:29092,kafka3:29092

              schema-registry:
                url: http://schema-registry:8081

    networks:
      - kafka-network

networks:
  kafka-network:
    external: true